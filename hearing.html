<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>事前ヒアリング｜KミュージックDTMスクール</title><link rel="icon" href="assets/k-cat.png" type="image/png"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/layout.css"><script src="assets/config.js" defer></script><script src="assets/courses.js" defer></script><script src="assets/form.js" defer></script></head><body><a class="skip" href="#main">本文へ移動</a><header class="header"><a class="brand" href="./"><img src="assets/k-cat.png" width="38" height="38" alt="" style="flex:none;object-fit:contain"><span class="school-wordmark">Kミュージック<wbr>DTMスクール</span></a><nav aria-label="メインナビゲーション"><a href="./#courses">コース</a><a href="./#pricing">料金</a><a class="text-link" href="./">トップへ戻る</a></nav></header><main id="main" class="form-wrap"><div class="subhero"><p class="eyebrow">PRE-LESSON HEARING</p><h1>いまの状況を教えてください。</h1><p>初回の詳しいヒアリングで、分かりやすい説明をするために使います。分からない項目は「不明」「未定」で構いません。</p></div><ol class="steps" aria-label="申込手順"><li>1. 受講申込</li><li class="active" aria-current="step">2. 事前ヒアリング</li><li>3. 内容確認</li></ol><div id="missing-application" class="notice" hidden>先に希望コースと連絡先をご入力ください。<a href="apply.html">受講申込へ戻る</a></div><form id="hearing-form"><fieldset><legend>目的と経験</legend><div class="field"><label for="purpose">受講目的・できるようになりたいこと<span class="required">必須</span></label><textarea id="purpose" name="purpose" rows="4" maxlength="3000" required placeholder="どのような作品を作りたいか、どんな作業を身につけたいか"></textarea></div><div class="field"><label for="experience">DTM・録音の経験<span class="required">必須</span></label><select id="experience" name="experience" required><option value="">選択してください</option><option>未経験</option><option>触ったことはあるが、基本から確認したい</option><option>録音や基本編集ができる</option><option>ミックスまで取り組んだことがある</option><option>制作・納品の経験がある</option></select></div><div class="field"><label for="experience-detail">現在できる作業・学習経験</label><textarea id="experience-detail" name="experienceDetail" rows="3" maxlength="2000"></textarea></div><div class="field"><label for="difficulty">困っていること<span class="required">必須</span></label><textarea id="difficulty" name="difficulty" rows="4" maxlength="3000" required placeholder="例：音が出ない、録音が歪む、ハモリの音の選び方が分からない"></textarea></div></fieldset><fieldset><legend>使用環境</legend><div class="form-grid"><div class="field"><label for="os">PCのOS<span class="required">必須</span></label><select id="os" name="os" required><option value="">選択してください</option><option>Windows</option><option>macOS</option><option>その他</option><option>未定・不明</option></select></div><div class="field"><label for="daw">DAW名・バージョン<span class="required">必須</span></label><input id="daw" name="daw" maxlength="150" required placeholder="例：Cubase／未定"></div></div><div class="field"><label for="equipment">使用機材<span class="required">必須</span></label><textarea id="equipment" name="equipment" rows="4" maxlength="2500" required placeholder="マイク、オーディオインターフェース、ヘッドホン、MIDIキーボードなど。未所有の場合はその旨をご記入ください。"></textarea></div><div class="field"><label for="plugins">使用しているプラグイン・編集ソフト</label><textarea id="plugins" name="plugins" rows="2" maxlength="1500"></textarea></div><div class="field"><label for="connection">Discord・TeamViewerの準備状況</label><select id="connection" name="connection"><option value="">選択してください</option><option>両方とも使用できる</option><option>Discordのみ使用できる</option><option>どちらも未設定</option><option>確認が必要</option></select></div></fieldset><div class="field"><label for="notes">その他、事前に伝えたいこと</label><textarea id="notes" name="notes" rows="3" maxlength="2000"></textarea><small>パスワード、決済情報、住所などは入力しないでください。</small></div><p id="form-error" class="error" role="alert"></p><div class="form-actions"><a class="text-link" href="apply.html">申込情報へ戻る</a><button class="button" type="submit">入力内容を確認する</button></div></form></main><footer class="footer wrap"><a class="brand" href="./">KミュージックDTMスクール</a><div><a href="privacy.html">個人情報の取り扱い</a><a href="information.html">受講条件・運営情報</a></div><p>© KミュージックDTMスクール</p></footer></body></html>
